<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리앱">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>용돈기입장</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  .balance { background: linear-gradient(135deg, var(--kc), color-mix(in srgb, var(--kc) 55%, white)); color: #fff; }
  .bal-label { font-size: 15px; opacity: .95; }
  .bal-amt { font-family: 'Jua', sans-serif; font-size: 40px; line-height: 1.2; margin: 4px 0; }
  .bal-sub { font-size: 14px; opacity: .95; }

  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-toggle button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; font-family: 'Jua', sans-serif; font-size: 18px; cursor: pointer; color: var(--muted); }
  .type-toggle button.on[data-type=out] { border-color: var(--bad); background: #fff1f3; color: var(--bad); }
  .type-toggle button.on[data-type=in] { border-color: var(--good); background: #effcf3; color: var(--good); }
  .amt-input { font-family: 'Jua', sans-serif; font-size: 26px; text-align: right; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .mnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .mnav button { border: 0; background: var(--accent-soft); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .mnav .title { font-size: 20px; }
  .msum { display: flex; gap: 12px; justify-content: center; font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }

  .day-h { font-size: 13px; color: var(--muted); margin: 14px 0 4px; font-weight: bold; }
  .tx { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .tx-ico { font-size: 24px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 12px; flex: none; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-cat { font-weight: bold; }
  .tx-memo { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-amt { font-family: 'Jua', sans-serif; font-size: 18px; white-space: nowrap; }
  .tx-amt.in, .tx-amt.unsave { color: var(--good); }
  .tx-amt.out { color: var(--bad); }
  .tx-amt.save { color: var(--save); }
  .tx-del { border: 0; background: none; color: #c9bdb5; font-size: 16px; cursor: pointer; padding: 4px; }

  .goal { border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .goal.reached { border-color: #facc15; background: #fffbea; }
  .goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .goal-name { font-family: 'Jua', sans-serif; font-size: 19px; }
  .bar { height: 14px; background: #f3ece4; border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #a78bfa, var(--save)); border-radius: 999px; transition: width .5s; }
  .goal .row { flex-wrap: wrap; margin-top: 8px; }

  .stat-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-box { background: var(--accent-soft); border-radius: 14px; padding: 10px; text-align: center; }
  .stat-box b { display: block; font-family: 'Jua', sans-serif; font-size: 18px; font-weight: 400; }
  .stat-box span { font-size: 13px; color: var(--muted); }
  .catbar { display: grid; grid-template-columns: 90px 1fr 80px; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
  .catbar .bar { margin: 0; }
  .catbar .bar > i { background: linear-gradient(90deg, #fda4af, var(--bad)); }
  .catbar .v { text-align: right; }
  .months { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 10px; }
  .mcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .mbars { display: flex; gap: 3px; align-items: flex-end; height: 110px; }
  .mbars i { width: 12px; border-radius: 4px 4px 0 0; display: block; min-height: 2px; }
  .mbars i.in { background: var(--good); }
  .mbars i.out { background: var(--bad); }
  .mcol span { font-size: 12px; color: var(--muted); }
  .legend { font-size: 13px; color: var(--muted); display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
  .cheer { background: #effcf3; border-radius: 14px; padding: 12px; margin-top: 12px; text-align: center; }
  @media (max-width: 420px) { .bal-amt { font-size: 34px; } .catbar { grid-template-columns: 76px 1fr 70px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="home" href="../index.html" title="처음 화면">🏠</a>
    <h1>💰 용돈기입장</h1>
    <span class="sync-badge hidden"></span>
  </div>

  <div id="kids" class="kids"></div>
  <div id="balance" class="card balance"></div>

  <div class="tabs" id="tabs">
    <button data-t="rec" class="on">✏️ 기록</button>
    <button data-t="goal">🐷 저금</button>
    <button data-t="stat">📊 통계</button>
    <button data-t="set">⚙️ 설정</button>
  </div>

  <!-- 기록 -->
  <section id="t-rec">
    <form class="card" id="addForm" autocomplete="off">
      <button type="button" class="btn big hidden" id="regularBtn" style="margin-bottom:12px"></button>
      <div class="type-toggle" id="typeToggle">
        <button type="button" data-type="out" class="on">💸 쓴 돈</button>
        <button type="button" data-type="in">💰 받은 돈</button>
      </div>
      <label class="f" for="amt">얼마예요?</label>
      <input id="amt" class="amt-input" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
      <div class="quick" id="quick">
        <button type="button" class="btn small" data-q="100">+100</button>
        <button type="button" class="btn small" data-q="500">+500</button>
        <button type="button" class="btn small" data-q="1000">+1천</button>
        <button type="button" class="btn small" data-q="5000">+5천</button>
        <button type="button" class="btn small" data-q="10000">+1만</button>
        <button type="button" class="btn small" data-q="0">지우기</button>
      </div>
      <label class="f">어떤 돈이에요?</label>
      <div class="chips" id="cats"></div>
      <label class="f" for="memo">메모</label>
      <input id="memo" maxlength="40" placeholder="예) 친구랑 떡볶이">
      <label class="f" for="date">날짜</label>
      <input id="date" type="date">
      <div style="margin-top:16px"><button class="btn primary big" type="submit">기록하기 ✨</button></div>
    </form>

    <div class="card">
      <div class="mnav"><button data-dm="-1">◀</button><span class="title monthLabel"></span><button data-dm="1">▶</button></div>
      <div class="msum" id="msum"></div>
      <div id="list"></div>
    </div>
  </section>

  <!-- 저금 목표 -->
  <section id="t-goal" class="hidden">
    <div class="card">
      <h2>🐷 갖고 싶은 것을 위해 모아요</h2>
      <div id="goals"></div>
      <form id="goalForm" autocomplete="off">
        <label class="f" for="gName">새 목표</label>
        <div class="row wrap-row">
          <input id="gName" class="grow" style="min-width:160px" maxlength="20" placeholder="예) 레고, 운동화">
          <input id="gTarget" style="width:140px" type="number" inputmode="numeric" min="1" placeholder="목표 금액">
          <button class="btn primary" type="submit">추가</button>
        </div>
      </form>
    </div>
    <div class="card" id="doneGoals"></div>
  </section>

  <!-- 통계 -->
  <section id="t-stat" class="hidden">
    <div class="card">
      <div class="mnav"><button data-dm="-1">◀</button><span class="title monthLabel"></span><button data-dm="1">▶</button></div>
      <div class="stat-boxes" id="statBoxes"></div>
      <div id="cheer"></div>
    </div>
    <div class="card">
      <h2>🛍️ 어디에 썼을까?</h2>
      <div id="catStats"></div>
    </div>
    <div class="card">
      <h2>📈 최근 6개월</h2>
      <div class="months" id="months"></div>
      <div class="legend"><span><i style="background:var(--good)"></i>받은 돈</span><span><i style="background:var(--bad)"></i>쓴 돈</span></div>
    </div>
  </section>

  <!-- 설정 -->
  <section id="t-set" class="hidden">
    <form class="card" id="regForm">
      <h2>💰 정기 용돈</h2>
      <p class="muted" style="margin:0">금액을 정해 두면 기록 화면에 “용돈 받기” 버튼이 생겨요.</p>
      <label class="f" for="regName">이름</label>
      <input id="regName" maxlength="12" placeholder="예) 주간 용돈">
      <label class="f" for="regAmt">금액 (0이면 버튼 숨김)</label>
      <input id="regAmt" type="number" inputmode="numeric" min="0" step="100">
      <div style="margin-top:14px"><button class="btn primary big" type="submit">저장</button></div>
    </form>
    <div class="card">
      <h2>🗂️ 기록 관리</h2>
      <p class="muted" style="margin-top:0">백업과 복원은 <a href="../index.html">처음 화면</a> 아래쪽에 있어요.</p>
      <button class="btn" id="resetBtn" style="color:var(--bad)">이 아이의 용돈 기록 모두 지우기</button>
    </div>
  </section>
</div>

<script src="../shared/common.js"></script>
<script>
const F = Family, $ = s => document.querySelector(s), esc = F.esc, won = F.won;
const IN_CATS = [['용돈', '💰'], ['심부름', '🧹'], ['세뱃돈', '🧧'], ['칭찬', '🌟'], ['선물받음', '🎁'], ['기타', '✨']];
const OUT_CATS = [['간식', '🍪'], ['문구', '✏️'], ['장난감', '🧸'], ['게임', '🎮'], ['책', '📚'], ['선물', '🎁'], ['교통', '🚌'], ['기타', '✨']];
const ICON = { '저금': '🐷', '꺼냄': '🐷', '목표달성': '🎉' };
[...IN_CATS, ...OUT_CATS].forEach(([n, e]) => { if (!ICON[n]) ICON[n] = e; });

let kid, data, type = 'out', cat = '간식', month = F.ymd().slice(0, 7);

function load() {
  kid = F.current();
  data = F.getData('allowance.' + kid.id, null) || {};
  data.tx = data.tx || [];
  data.goals = data.goals || [];
  data.regular = data.regular || { name: '용돈', amount: 0 };
  document.documentElement.style.setProperty('--kc', kid.color);
}
function save() { F.setData('allowance.' + kid.id, data); }
const sign = t => (t.type === 'in' || t.type === 'unsave') ? 1 : -1;
const wallet = () => data.tx.reduce((s, t) => s + sign(t) * t.amount, 0);
const piggy = () => data.goals.filter(g => !g.done).reduce((s, g) => s + g.saved, 0);
const toInt = v => parseInt(String(v || '').replace(/[^0-9]/g, ''), 10) || 0;
function addTx(t) { data.tx.push({ id: F.uid(), ts: Date.now(), date: F.ymd(), memo: '', ...t }); }

function renderAll() {
  renderBalance(); renderCats(); renderRegular(); renderList(); renderGoals(); renderStats(); renderSettings();
}

function renderBalance() {
  const w = wallet(), p = piggy();
  $('#balance').innerHTML = `
    <div class="bal-label">${esc(kid.emoji)} ${esc(kid.name)}의 지갑</div>
    <div class="bal-amt">${won(w)}</div>
    <div class="bal-sub">🐷 저금통 ${won(p)} · 모두 합치면 ${won(w + p)}</div>`;
}

function renderCats() {
  const list = type === 'in' ? IN_CATS : OUT_CATS;
  if (!list.some(([n]) => n === cat)) cat = list[0][0];
  $('#cats').innerHTML = list.map(([n, e]) => `<button type="button" class="chip ${n === cat ? 'on' : ''}" data-cat="${n}">${e} ${n}</button>`).join('');
  document.querySelectorAll('#typeToggle button').forEach(b => b.classList.toggle('on', b.dataset.type === type));
}

function renderRegular() {
  const r = data.regular, b = $('#regularBtn');
  b.classList.toggle('hidden', !(r.amount > 0));
  b.textContent = `💰 ${r.name || '용돈'} 받기 (+${won(r.amount)})`;
}

function monthTx() { return data.tx.filter(t => t.date.startsWith(month)); }
function labelOf(t) {
  if (t.type === 'save') return ['🐷', '저금하기'];
  if (t.type === 'unsave') return ['🐷', '저금통에서 꺼냄'];
  return [ICON[t.cat] || '✨', t.cat];
}

function renderList() {
  const [y, m] = month.split('-');
  document.querySelectorAll('.monthLabel').forEach(el => el.textContent = `${y}년 ${+m}월`);
  const items = monthTx().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const inSum = items.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const outSum = items.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  $('#msum').innerHTML = `<span style="color:var(--good)">받은 돈 +${won(inSum)}</span><span style="color:var(--bad)">쓴 돈 −${won(outSum)}</span>`;
  if (!items.length) { $('#list').innerHTML = '<div class="empty">이 달에는 아직 기록이 없어요 📝</div>'; return; }
  let html = '', last = '';
  const wd = ['일', '월', '화', '수', '목', '금', '토'];
  for (const t of items) {
    if (t.date !== last) {
      const d = F.parseYmd(t.date);
      html += `<div class="day-h">${d.getMonth() + 1}월 ${d.getDate()}일 (${wd[d.getDay()]})</div>`;
      last = t.date;
    }
    const [ico, lab] = labelOf(t);
    const sg = sign(t) > 0 ? '+' : '−';
    html += `<div class="tx">
      <div class="tx-ico">${ico}</div>
      <div class="tx-main"><div class="tx-cat">${esc(lab)}</div><div class="tx-memo">${esc(t.memo)}</div></div>
      <div class="tx-amt ${t.type}">${sg}${won(t.amount)}</div>
      <button class="tx-del" data-del="${t.id}" title="지우기">✕</button>
    </div>`;
  }
  $('#list').innerHTML = html;
}

function renderGoals() {
  const act = data.goals.filter(g => !g.done);
  $('#goals').innerHTML = act.length ? act.map(g => {
    const pct = Math.min(100, Math.round(g.saved / g.target * 100));
    const reached = g.saved >= g.target;
    return `<div class="goal ${reached ? 'reached' : ''}">
      <div class="goal-top"><span class="goal-name">${reached ? '🎉' : '🎯'} ${esc(g.name)}</span><span class="muted">${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="muted" style="font-size:14px">${won(g.saved)} / ${won(g.target)} ${reached ? '· 목표를 이뤘어요!' : `· 앞으로 ${won(g.target - g.saved)} 남았어요`}</div>
      <div class="row">
        <button class="btn small" data-g="save" data-id="${g.id}">🐷 저금하기</button>
        <button class="btn small" data-g="take" data-id="${g.id}">꺼내기</button>
        ${reached ? `<button class="btn small primary" data-g="buy" data-id="${g.id}">🎁 이제 살래요!</button>` : ''}
        <button class="btn small" data-g="del" data-id="${g.id}" style="margin-left:auto;color:var(--muted)">목표 지우기</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">아직 목표가 없어요. 갖고 싶은 것을 적어 볼까요? 🌟</div>';

  const done = data.goals.filter(g => g.done);
  $('#doneGoals').classList.toggle('hidden', !done.length);
  $('#doneGoals').innerHTML = `<h2>🏆 이룬 목표</h2>` + done.map(g =>
    `<div class="tx"><div class="tx-ico">🏆</div><div class="tx-main"><div class="tx-cat">${esc(g.name)}</div><div class="tx-memo">${esc(g.doneDate || '')}</div></div><div class="tx-amt">${won(g.target)}</div></div>`).join('');
}

function renderStats() {
  const items = monthTx();
  const sum = t => items.filter(x => x.type === t).reduce((s, x) => s + x.amount, 0);
  const inS = sum('in'), outS = sum('out'), saveS = sum('save') - sum('unsave');
  $('#statBoxes').innerHTML = `
    <div class="stat-box"><span>받은 돈</span><b style="color:var(--good)">${won(inS)}</b></div>
    <div class="stat-box"><span>쓴 돈</span><b style="color:var(--bad)">${won(outS)}</b></div>
    <div class="stat-box"><span>저금</span><b style="color:var(--save)">${won(Math.max(0, saveS))}</b></div>`;
  let msg = '';
  if (!items.length) msg = '';
  else if (inS > 0 && outS <= inS) msg = `👏 받은 돈보다 ${won(inS - outS)} 덜 썼어요. 아주 잘했어요!`;
  else if (outS > inS) msg = `🤔 받은 돈보다 ${won(outS - inS)} 더 썼어요. 다음 달엔 조금 아껴 볼까요?`;
  $('#cheer').innerHTML = msg ? `<div class="cheer">${msg}</div>` : '';

  const by = {};
  items.filter(t => t.type === 'out').forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $('#catStats').innerHTML = rows.length ? rows.map(([c, v]) =>
    `<div class="catbar"><span>${ICON[c] || '✨'} ${esc(c)}</span><div class="bar"><i style="width:${Math.round(v / max * 100)}%"></i></div><span class="v">${won(v)}</span></div>`).join('')
    : '<div class="empty">이 달에 쓴 돈이 없어요</div>';

  const [y, m] = month.split('-').map(Number);
  const cols = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const tx = data.tx.filter(t => t.date.startsWith(key));
    cols.push({ label: (d.getMonth() + 1) + '월', inS: tx.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0), outS: tx.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0) });
  }
  const mx = Math.max(1, ...cols.map(c => Math.max(c.inS, c.outS)));
  $('#months').innerHTML = cols.map(c => `<div class="mcol">
    <div class="mbars"><i class="in" style="height:${c.inS / mx * 100}%" title="받은 돈 ${won(c.inS)}"></i><i class="out" style="height:${c.outS / mx * 100}%" title="쓴 돈 ${won(c.outS)}"></i></div>
    <span>${c.label}</span></div>`).join('');
}

function renderSettings() {
  $('#regName').value = data.regular.name || '';
  $('#regAmt').value = data.regular.amount || 0;
}

// ---------- 이벤트 ----------
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['rec', 'goal', 'stat', 'set'].forEach(t => $('#t-' + t).classList.toggle('hidden', t !== b.dataset.t));
};

$('#typeToggle').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.type; renderCats();
};
$('#cats').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat; renderCats();
};
$('#quick').onclick = e => {
  const b = e.target.closest('[data-q]'); if (!b) return;
  const q = +b.dataset.q;
  $('#amt').value = q === 0 ? '' : toInt($('#amt').value) + q;
};

$('#addForm').onsubmit = e => {
  e.preventDefault();
  const amt = toInt($('#amt').value);
  if (amt <= 0) return F.toast('금액을 입력해 주세요 🙂');
  if (type === 'out' && amt > wallet() && !confirm(`지갑에 있는 돈(${won(wallet())})보다 많아요.\n그래도 기록할까요?`)) return;
  const date = $('#date').value || F.ymd();
  addTx({ date, type, amount: amt, cat, memo: $('#memo').value.trim() });
  save();
  $('#amt').value = ''; $('#memo').value = '';
  month = date.slice(0, 7);
  F.toast(type === 'in' ? '💰 받은 돈을 기록했어요!' : '💸 쓴 돈을 기록했어요!');
  renderAll();
};

$('#regularBtn').onclick = () => {
  const r = data.regular;
  if (!confirm(`${r.name || '용돈'} ${won(r.amount)}을 받았나요?`)) return;
  addTx({ type: 'in', amount: r.amount, cat: '용돈', memo: r.name || '용돈' });
  save(); month = F.ymd().slice(0, 7);
  F.toast('💰 용돈이 들어왔어요!'); F.celebrate(['💰', '🪙', '✨']);
  renderAll();
};

document.addEventListener('click', e => {
  const m = e.target.closest('[data-dm]');
  if (m) {
    const [y, mo] = month.split('-').map(Number);
    const d = new Date(y, mo - 1 + Number(m.dataset.dm), 1);
    month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    renderList(); renderStats();
  }
});

$('#list').onclick = e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const t = data.tx.find(x => x.id === b.dataset.del);
  if (!t || !confirm('이 기록을 지울까요?')) return;
  if (t.goalId) {
    const g = data.goals.find(x => x.id === t.goalId);
    if (g && !g.done) {
      if (t.type === 'save') g.saved = Math.max(0, g.saved - t.amount);
      if (t.type === 'unsave') g.saved += t.amount;
    }
  }
  data.tx = data.tx.filter(x => x !== t);
  save(); renderAll();
};

$('#goalForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#gName').value.trim(), target = toInt($('#gTarget').value);
  if (!name || target <= 0) return F.toast('목표 이름과 금액을 적어 주세요');
  data.goals.push({ id: F.uid(), name, target, saved: 0, created: F.ymd() });
  save(); $('#gName').value = ''; $('#gTarget').value = '';
  F.toast('🎯 새 목표가 생겼어요!'); renderAll();
};

$('#goals').onclick = e => {
  const b = e.target.closest('[data-g]'); if (!b) return;
  const g = data.goals.find(x => x.id === b.dataset.id); if (!g) return;
  const act = b.dataset.g;
  if (act === 'save') {
    const amt = toInt(prompt(`얼마를 저금할까요?\n(지금 지갑: ${won(wallet())})`));
    if (amt <= 0) return;
    if (amt > wallet()) return F.toast('지갑에 돈이 모자라요 😅');
    addTx({ type: 'save', amount: amt, cat: '저금', memo: g.name, goalId: g.id });
    g.saved += amt;
    save();
    if (g.saved >= g.target) { F.celebrate(); F.toast(`🎉 '${g.name}' 목표를 이뤘어요!`); }
    else F.toast(`🐷 ${won(amt)} 저금했어요!`);
  } else if (act === 'take') {
    const amt = toInt(prompt(`얼마를 꺼낼까요?\n(저금한 돈: ${won(g.saved)})`));
    if (amt <= 0) return;
    if (amt > g.saved) return F.toast('저금한 돈보다 많이 꺼낼 수 없어요');
    addTx({ type: 'unsave', amount: amt, cat: '꺼냄', memo: g.name, goalId: g.id });
    g.saved -= amt; save();
  } else if (act === 'buy') {
    if (!confirm(`'${g.name}'을(를) 살 건가요?\n저금한 ${won(g.saved)}을 사용해요.`)) return;
    const amt = g.saved;
    addTx({ type: 'unsave', amount: amt, cat: '꺼냄', memo: g.name, goalId: g.id });
    addTx({ type: 'out', amount: amt, cat: '목표달성', memo: g.name });
    g.done = true; g.doneDate = F.ymd(); g.saved = 0;
    save(); F.celebrate(['🎁', '🏆', '🎉', '⭐']); F.toast('🏆 정말 멋져요! 끝까지 모았어요!');
  } else if (act === 'del') {
    const msg = g.saved > 0 ? `'${g.name}' 목표를 지울까요?\n저금한 ${won(g.saved)}은 지갑으로 돌아가요.` : `'${g.name}' 목표를 지울까요?`;
    if (!confirm(msg)) return;
    if (g.saved > 0) addTx({ type: 'unsave', amount: g.saved, cat: '꺼냄', memo: g.name + ' (목표 지움)' });
    data.goals = data.goals.filter(x => x !== g);
    save();
  }
  renderAll();
};

$('#regForm').onsubmit = e => {
  e.preventDefault();
  data.regular = { name: $('#regName').value.trim() || '용돈', amount: toInt($('#regAmt').value) };
  save(); F.toast('저장했어요!'); renderAll();
};

$('#resetBtn').onclick = () => {
  if (!confirm(`${kid.name}의 용돈 기록을 모두 지울까요?`)) return;
  if (!confirm('정말요? 지우면 되돌릴 수 없어요.')) return;
  data = { tx: [], goals: [], regular: data.regular };
  save(); F.toast('모두 지웠어요'); renderAll();
};

// ---------- 시작 ----------
$('#date').value = F.ymd();
function onKid() { load(); renderAll(); F.sync.pull(['allowance.' + kid.id]); }
load();
F.renderPicker($('#kids'), onKid);
renderAll();

// 구글 시트에 더 최신 기록이 있으면 받아서 다시 그림
window.addEventListener('familysync', e => {
  if (!e.detail.keys.some(k => k === 'family.kids' || k === 'allowance.' + kid.id)) return;
  load(); F.renderPicker($('#kids'), onKid); renderAll();
});
F.sync.pull(['family.kids', 'allowance.' + kid.id]);
</script>
</body>
</html>
